name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests (surefire), then the packaged jar's stdio MCP integration test (failsafe).
      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  native:
    name: Native image (${{ matrix.profile }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [mcp, api]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # One native build per runner: native-image peaks at about 7 GB of memory.
      # Images are only loaded into the runner's Docker engine, never pushed.
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BUILD_PROFILE=${{ matrix.profile }}
          tags: skoda-${{ matrix.profile }}:native
          load: true
          push: false
          cache-from: type=gha,scope=native-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.profile }}

      # Stub MyŠkoda Public API in Docker; checks the MCP protocol over stdio (including exit on
      # stdin EOF) or the REST endpoints, health and Swagger UI.
      - name: Smoke test
        shell: pwsh
        run: |
          $only = if ('${{ matrix.profile }}' -eq 'mcp') { @{ SkipApi = $true } } else { @{ SkipMcp = $true } }
          ./scripts/smoke-test-native.ps1 @only -McpImage skoda-mcp:native -ApiImage skoda-api:native

  native-test:
    name: Native tests (nativeTest)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # JVM tests, then the same tests compiled into a native test executable (Dockerfile target
      # native-test). Fails the build on a test failure; produces no image.
      - name: Run tests natively
        uses: docker/build-push-action@v6
        with:
          context: .
          target: native-test
          push: false
          cache-from: type=gha,scope=native-test
          cache-to: type=gha,mode=max,scope=native-test

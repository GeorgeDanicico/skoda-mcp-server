# A container must listen on all of its own interfaces for Docker port mapping
# to reach it. Restrict exposure at the Docker/host boundary when needed.
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=8090
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.mcp.server.common.autoconfigure.McpServerAutoConfiguration
management.endpoints.web.exposure.include=health
logging.level.root=INFO

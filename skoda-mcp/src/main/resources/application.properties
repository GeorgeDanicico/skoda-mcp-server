spring.application.name=skoda-mcp
spring.profiles.default=mcp
spring.main.banner-mode=off
spring.main.keep-alive=true
spring.config.import=optional:file:.env[.properties]

# Secrets may come from the imported local .env file or from real process
# environment variables. The .env file is intentionally ignored by Git.
skoda.email=${SKODA_EMAIL:}
skoda.password=${SKODA_PASSWORD:}
skoda.vin=${SKODA_VIN:}
skoda.spin=${SKODA_SPIN:}

# Use the Java client's default remote API when neither variable is set.
# SKODA_API_BASE_URL remains supported for existing MCP launch configurations.
# The public deployment currently presents an invalid TLS certificate. Keep
# the API hop local by default; api-skoda must listen on loopback port 8080.
skoda.api-base-url=${SKODA_API_BASE_URL:http://127.0.0.1:8080}
skoda.gateway.token=${SKODA_GATEWAY_TOKEN:}
skoda.snapshot-cache-seconds=${SKODA_SNAPSHOT_CACHE_SECONDS:5}
skoda.snapshot-timeout-seconds=${SKODA_SNAPSHOT_TIMEOUT_SECONDS:18}
